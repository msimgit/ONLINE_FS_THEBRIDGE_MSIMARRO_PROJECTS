<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meteo · MS Dashboard</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/meteo.css" />
</head>

<body>

  <nav class="navbar">
    <div class="nav-group">

      <!-- Botones izquierda -->
      <div class="nav-links">
        <a href="./reloj.html" class="nav-btn">Reloj</a>
        <a href="./meteo.html" class="nav-btn">Meteo</a>
      </div>

      <!-- Logo centro -->
      <a href="../../index.html" class="nav-logo-link">
        <img src="https://res.cloudinary.com/dyd4vcwkg/image/upload/v1777720506/ms_logo_oswjax.png" alt="MS Logo"
          class="nav-logo" />
      </a>

      <!-- Botones derecha -->
      <div class="nav-links">
        <a href="./pass.html" class="nav-btn">Contraseñas</a>
        <a href="./links.html" class="nav-btn">Links</a>
      </div>

      <!-- Hamburguesa — solo visible en móvil -->
      <button class="nav-hamburger" id="nav-hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>

    <!-- Menú desplegable móvil -->
    <div class="nav-menu" id="nav-menu">
      <a href="./reloj.html" class="nav-menu-btn">Reloj</a>
      <a href="./meteo.html" class="nav-menu-btn">Meteo</a>
      <a href="./pass.html" class="nav-menu-btn">Contraseñas</a>
      <a href="./links.html" class="nav-menu-btn">Links</a>
    </div>

  </nav>

  <main class="page-content">

    <!-- Tarjeta principal -->
    <div class="meteo-card" id="meteo-card">

      <div id="loader" class="loader">Cargando...</div>

      <div id="meteo-data" class="meteo-data hidden">

        <!-- COLUMNA IZQUIERDA -->
        <div class="meteo-left">
          <div class="meteo-location">
            <span id="ciudad">--</span>
            <span class="meteo-sep">/</span>
            <span id="pais">--</span>
          </div>
          <div id="condicion" class="meteo-condicion">--</div>
          <img id="icono" src="" alt="icono clima" class="meteo-icon" />
          <span id="temperatura" class="meteo-temp">--</span>
        </div>

        <!-- DIVISOR -->
        <div class="meteo-divider"></div>

        <!-- COLUMNA DERECHA -->
        <div class="meteo-right">
          <div class="meteo-detalle">
            <span class="detalle-label">Precipitación</span>
            <span id="precipitacion" class="detalle-valor">--</span>
          </div>
          <div class="meteo-detalle">
            <span class="detalle-label">Humedad</span>
            <span id="humedad" class="detalle-valor">--</span>
          </div>
          <div class="meteo-detalle">
            <span class="detalle-label">Viento</span>
            <span id="viento" class="detalle-valor">--</span>
          </div>
          <div class="meteo-detalle">
            <span class="detalle-label">Presión</span>
            <span id="presion" class="detalle-valor">--</span>
          </div>
          <div class="meteo-detalle">
            <span class="detalle-label">Sensación</span>
            <span id="sensacion" class="detalle-valor">--</span>
          </div>
          <div class="meteo-detalle">
            <span class="detalle-label">Visibilidad</span>
            <span id="visibilidad" class="detalle-valor">--</span>
          </div>
          <div class="meteo-detalle">
            <span class="detalle-label">UV</span>
            <span id="uv" class="detalle-valor">--</span>
          </div>
        </div>

      </div>
    </div>

    <!-- TARJETA FORECAST 24H -->
    <h3 class="forecast-title">Próximas 24h</h3>

    <div class="meteo-card">
      <button class="forecast-playbtn" id="forecast-play" title="Play/Pause">▶</button>
      <div class="forecast-scroll" id="forecast-scroll">
        <!-- generado por JS -->
      </div>
    </div>

    <!-- Previsión 24h -->
    <div class="forecast-wrapper" id="forecast-wrapper">
      <div class="forecast-scroll" id="forecast-scroll">
        <!-- se generará con JS -->
      </div>
      <a href="../../index.html" class="card-btn">Volver al dashboard</a>
    </div>

  </main>

  <footer id="bg-franja">
    <div class="bg-overlay"></div>
  </footer>

  <script src="../js/meteo.js"></script>
  <script src="../js/main.js"></script>

</body>

</html>
